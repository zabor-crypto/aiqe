# An illustrative `aiqe.toml`, showing the shape of a six-contract
# configuration for a research repository.
#
# THIS FILE IS AN EXAMPLE, NOT A STARTING CONFIGURATION THAT WORKS.
#
# What it demonstrates: the shape of a configuration that declares all six
# contract families across a research repository, and binds a required
# validator to each. That is all it demonstrates.
#
# The validator commands below are placeholders. AIQE ships no validators and
# cannot: a check AIQE wrote would be a check that has never seen your data,
# your venue, your accounting identity or your resampling rules. Every command
# here is yours to review, implement or replace.
#
# What you get from copying this unchanged depends on two things, and it is
# worth being precise about them, because the file cannot decide either:
#
#   * which declared surface your change touched. A change under a `quant =
#     true` surface pulls in that surface's contracts; a change under the
#     non-quant surface pulls in none of them.
#   * which of the configured commands actually exist and succeed on your
#     machine.
#
# So a change to a quant surface, with these placeholder commands still
# unwritten, gets you UNAVAILABLE validators, CONTRACT_UNKNOWN contracts and a
# refused completion — the state this file is built to produce. But a change
# to a path this example declares non-quant, such as `scripts/**`, applies no
# quant contract at all, and if every applicable declared check does exist and
# passes, AIQE can legitimately report REVIEWABLE. That is correct behaviour,
# not a loophole: the verdict is about the checks that applied to the change
# that was made, and none of the quant contracts applied to it.
#
# Which is the point worth carrying away: copying this file tells you nothing
# about whether your repository's numerical work is adequately checked.
# Contract evidence exists only for validators that were actually bound to an
# applicable contract and actually ran. Until you write them, this is a shape.
#
# `aiqe init` writes a scaffold that declares no surfaces and no validators at
# all, for the same reason: a guess that happened to be wrong would be a
# configuration nobody wrote and everybody trusts. This file is the worked
# illustration of what you would grow that scaffold into.
#
# Reference: docs/config.md

schema = 1


# --- Surfaces ---------------------------------------------------------------
#
# A surface says which paths are quant-critical and which contract families
# apply to them. Every matching surface is evaluated and their obligations
# union, so a path may pick up contracts from more than one entry.
#
# `paths` are AIQE's own byte patterns, never Git pathspec. `**` is a whole
# component: `src/strategy/**` matches `src/strategy` and everything under it.

# Signal construction. Anything that decides at a point in time carries
# CAUSALITY, and joining series to make that decision carries DATA_ALIGNMENT.
[[surface]]
paths = ["src/strategy/**", "src/signals/**"]
quant = true
contracts = ["CAUSALITY", "DATA_ALIGNMENT", "TRAIN_TEST_SEPARATION"]

# The simulator: what a fill would have cost, and whether the books balance
# afterwards. DETERMINISM sits here because a backtest that does not reproduce
# cannot be evidence of anything.
[[surface]]
paths = ["src/backtest/**", "src/execution/**"]
quant = true
contracts = ["EXECUTION_REALISM", "ACCOUNTING", "DETERMINISM"]

# Ingestion and resampling. Where timezone, index and resample-boundary
# defects are introduced, usually invisibly.
[[surface]]
paths = ["src/data/**"]
quant = true
contracts = ["DATA_ALIGNMENT", "DETERMINISM"]

# Model fitting and selection. Declared separately because
# TRAIN_TEST_SEPARATION is the family a shared preprocessing step defeats.
[[surface]]
paths = ["src/models/**", "src/features/**"]
quant = true
contracts = ["TRAIN_TEST_SEPARATION", "CAUSALITY"]

# Explicitly not quant-critical. Stating this is not decoration: an
# unclassified path is reported as unclassified, and declaring a path both
# quant and non-quant is a configuration conflict that fails closed.
[[surface]]
paths = ["tests/**", "docs/**", "scripts/**"]
quant = false


# --- Validators -------------------------------------------------------------
#
# A validator is a command your repository defines. AIQE runs it and records
# what it said; it does not interpret the result, and `PASS` means only that
# the command exited zero.
#
# `contracts` is what binds a validator to a family. A validator with no
# `contracts` key — like the unit suite below — is a general check: it runs,
# and its outcome is reported, but it closes no contract. That is why a
# repository whose only check is a green test suite still reports
# COVERAGE_GAP on every applicable family.
#
# `required = true` is what makes coverage real. An optional validator does
# not close a gap, and neither does a generic suite.
#
# THE COMMANDS BELOW ARE PLACEHOLDERS, chosen to be unlikely to exist rather
# than guaranteed not to — this file cannot know what is on your machine.
# Replace each one with the command in your repository that actually asks that
# question, and delete any family you have not written a check for: leaving it
# declared and uncovered is the honest state, and AIQE will keep saying so.

# The general suite. Bound to no contract on purpose: it is evidence that the
# tests that exist passed, and nothing more.
[[validator]]
id = "unit"
run = ["pytest", "-q", "tests/unit"]
required = true
timeout = 600

[[validator]]
id = "causality"
run = ["python", "checks/no_lookahead.py"]
required = true
timeout = 300
contracts = ["CAUSALITY"]

[[validator]]
id = "alignment"
run = ["python", "checks/index_alignment.py"]
required = true
timeout = 300
contracts = ["DATA_ALIGNMENT"]

[[validator]]
id = "execution-realism"
run = ["python", "checks/fill_model.py", "--strict"]
required = true
timeout = 300
contracts = ["EXECUTION_REALISM"]

[[validator]]
id = "accounting"
run = ["python", "checks/reconcile_pnl.py"]
required = true
timeout = 300
contracts = ["ACCOUNTING"]

[[validator]]
id = "train-test-separation"
run = ["python", "checks/no_leakage.py"]
required = true
timeout = 600
contracts = ["TRAIN_TEST_SEPARATION"]

[[validator]]
id = "determinism"
run = ["python", "checks/reproduce.py", "--runs", "2"]
required = true
timeout = 900
contracts = ["DETERMINISM"]
