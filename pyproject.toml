[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aiqe"
description = "Quant engineering assurance layer. Deterministic, local, no model calls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dynamic = ["version"]

# AIQE core has no third-party runtime dependencies, and no third-party test
# dependencies. The test suite runs on the standard library `unittest` module.
# This is deliberate: an assurance layer that drags in a dependency tree is
# harder to audit than the thing it is auditing.
#
# The 3.11 floor is now a hard requirement rather than only a support
# boundary: `aiqe.toml` is read with the standard library's `tomllib`, which
# arrived in 3.11. That was the choice with the smallest auditable surface -
# the alternative was a third-party TOML parser in the one component whose job
# is to refuse configuration it does not understand.
dependencies = []

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
aiqe = "aiqe.cli:main_entry"

[tool.setuptools.dynamic]
version = { attr = "aiqe.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
