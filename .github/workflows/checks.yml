name: checks

on:
  push:
    branches: [main]
    # A tag is the moment a claim is published, so a tag always runs the full
    # evidence lane below.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      lane:
        description: "full = every claimed surface incl. macOS; fast = Linux only"
        type: choice
        options: [full, fast]
        default: full

# A newer commit on the same ref makes an older FAST run irrelevant, so it is
# cancelled. A FULL run never is: its manifest is the evidence a release rests
# on, and re-earning it costs ten macOS runners. Keyed on the event as well as
# the ref so a push run and a pull_request run of one branch stay independent,
# and so a push to main cannot cancel a full lane dispatched from main.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

permissions:
  contents: read

# Every job that is support evidence writes a *surface record* - a JSON
# document naming the machine it ran on, what it executed, and what it
# skipped - and uploads it. The `manifest` job at the end collects them and
# applies the support gate in `bench/release/support.py`.
#
# That indirection is the point. A green checkmark is not a support claim: a
# claim needs a named surface, a named evidence level and a recorded skip
# list, and `--require-all-claims` makes a missing one fail the build rather
# than quietly narrow the manifest.
#
# --- Two lanes, and why -------------------------------------------------
#
# A macOS runner bills at ten times a Linux one. Running the nine macOS jobs
# on every push spent 1800 of this account's 2000 monthly Actions minutes in
# three days and then stopped CI dead for everything else, which is a worse
# outcome for evidence than not running them on every push.
#
# So the matrix is split by *when a claim is made* rather than trimmed:
#
#   FAST  (push, pull_request)   Linux only. ~14 minutes of quota per run.
#   FULL  (tag, workflow_dispatch)  every claimed surface. ~146 per run.
#
# This narrows nothing that is claimed, because the manifest is gated on
# observations rather than on a green tick: a fast run has no macOS surface
# record, so `python_support` marks every claimed minor NOT_PROVEN and says
# which observation is missing. Only the full lane passes
# `--require-all-claims`, so a release still cannot be cut without the whole
# matrix having actually run. The failure mode this cannot produce is the
# dangerous one - a run that claims macOS without having touched a Mac.

jobs:
  # --- Which lane this run is --------------------------------------------
  #
  # One place decides, so the four gated jobs and the manifest's gate flag can
  # never disagree about it. It also writes the answer into the run summary:
  # a green `checks` run means two different things now, and a reader must not
  # have to reconstruct which from the job list.
  lane:
    name: evidence lane
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.decide.outputs.full }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          # `github.event.inputs` is readable on every event - absent, and so
          # empty, on all but workflow_dispatch. The `:-full` below covers the
          # empty case, so the two agree on the default rather than relying on
          # the form's one alone.
          REQUESTED: ${{ github.event.inputs.lane }}
        run: |
          set -euo pipefail
          full=false
          case "$EVENT" in
            workflow_dispatch)
              if [ "${REQUESTED:-full}" != "fast" ]; then full=true; fi
              ;;
            push)
              case "$REF" in
                refs/tags/*) full=true ;;
              esac
              ;;
          esac
          echo "full=$full" >> "$GITHUB_OUTPUT"
          if [ "$full" = "true" ]; then
            {
              echo "## Evidence lane: FULL"
              echo
              echo "Every claimed surface runs, including macOS, and the"
              echo "manifest is gated with \`--require-all-claims\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Evidence lane: FAST"
              echo
              echo "Linux surfaces only. The macOS jobs are skipped, so this"
              echo "run proves nothing about macOS and the manifest will"
              echo "record every claimed Python minor as NOT_PROVEN. That is"
              echo "the gate working, not a regression."
              echo
              echo "Run the full lane from the Actions tab (Run workflow ->"
              echo "lane: full) or by pushing a tag."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # --- Full suite, on every claimed Python minor --------------------------
  #
  # The literal minimum the release matrix asks for: all of 3.11 to 3.14. The
  # interior minors are not inferred from the endpoints, which is what the
  # NC-SUPPORT-CLAIM control exists to demonstrate. The macOS half of this
  # matrix is `tests-macos` below, and runs in the full lane only.
  tests:
    name: suite (${{ matrix.os }}, python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the whole behavioural suite on every claimed
        # interpreter minor, on every run, in both lanes. It is the cheap
        # surface, so nothing about it is rationed.
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      AIQE_RUNNER_LABEL: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Report toolchain
        run: |
          python --version
          git --version
      - name: Run the test suite and record the surface
        run: |
          python bench/run-suite.py \
            --output "${RUNNER_TEMP}/surface.json" --verbose
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surface-suite-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/surface.json

  # --- The same suite on macOS, in the full lane only ---------------------
  #
  # A documented tiering, not a rounding-down. macOS runs the behavioural
  # suite on the ends of the claimed range, and carries the installed-artifact
  # end-to-end on all four minors through `release-proof-macos` below.
  #
  # The support gate encodes exactly that split - the artifact evidence is
  # required on every claimed family, the suite on at least one - and the
  # manifest records, per minor, which families actually ran the suite. What
  # the tiering gives up is a defect that appears only on macOS, only on 3.12
  # or 3.13, and only in a case the end-to-end does not reach.
  #
  # The matrix is written as `include` rows rather than a `python:` list
  # because it is deliberately not the whole claimed range; a `python:` list
  # here would be a list that omits claimed minors, which is the shape the
  # workflow tests refuse.
  tests-macos:
    name: suite (${{ matrix.os }}, python ${{ matrix.python }})
    needs: lane
    if: needs.lane.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    env:
      AIQE_RUNNER_LABEL: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Report toolchain
        run: |
          python --version
          git --version
      - name: Run the test suite and record the surface
        run: |
          python bench/run-suite.py \
            --output "${RUNNER_TEMP}/surface.json" --verbose
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surface-suite-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/surface.json

  # --- Lower-bound and additional surfaces --------------------------------
  #
  # Each entry answers "which real compatibility risk does this cover", and
  # nothing is here to make the matrix look bigger:
  #
  #   ubuntu-22.04       Ubuntu 22.04 LTS is still in standard support, so it
  #                      is a live user population running an older Python and
  #                      an older toolchain than the newest hosted image.
  #   ubuntu-24.04-arm   Linux on arm64. A pure-Python wheel is not an
  #                      argument about a processor, and without this job
  #                      Linux/arm64 is NOT_PROVEN.
  #   python:3.11-bullseye  Debian 11's Git. This is the Git lower-bound
  #                      surface: the frozen core leans on a dozen Git
  #                      behaviours, and the only honest way to publish a
  #                      boundary is to run the whole suite against an old
  #                      Git rather than to reason about release notes.
  #
  # The two macOS surfaces this list used to carry are in `surfaces-macos`
  # below, unchanged, and run in the full lane only.
  surfaces:
    name: surface ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-22.04-py311
            os: ubuntu-22.04
            python: "3.11"
          - label: ubuntu-24.04-arm-py314
            os: ubuntu-24.04-arm
            python: "3.14"
          - label: debian-11-old-git
            os: ubuntu-latest
            container: python:3.11-bullseye
            proves: git-floor-refusal
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      AIQE_RUNNER_LABEL: ${{ matrix.os }}
      AIQE_CONTAINER_IMAGE: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: matrix.container == ''
        with:
          python-version: ${{ matrix.python }}
      # A container job runs as root against a workspace owned by the runner
      # user, so Git declines to operate on it at all. This is the container's
      # ownership, not AIQE's: the release-proof runner exports the tracked
      # content with `git ls-files`, and that read has to be possible before
      # anything can be measured.
      - name: Let Git read a workspace owned by another user
        if: matrix.container != ''
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Report toolchain
        run: |
          python3 --version
          git --version
      # Linux surfaces are cheap, so they carry the whole suite. The macOS
      # ones in `surfaces-macos` carry the artifact evidence only, for the
      # reason the `tests-macos` matrix states: the suite answers the same
      # questions on a second macOS release, at ten times the price.
      - name: Run the test suite and record the surface
        if: matrix.proves != 'git-floor-refusal'
        run: |
          python3 bench/run-suite.py --output "${RUNNER_TEMP:-/tmp}/surface-suite.json"
      - name: Prove the installed artifact on this surface
        if: matrix.proves != 'git-floor-refusal'
        run: |
          python3 bench/run-release-proof.py \
            --parts artifacts,install,e2e,scan \
            --output "${RUNNER_TEMP:-/tmp}/surface-artifact.json"

      # The Git lower-bound surface does not run the suite, because on this
      # Git AIQE refuses to run at all - and that refusal is the thing being
      # proved. GIT_CONFIG_SYSTEM and GIT_CONFIG_GLOBAL arrived in Git 2.32;
      # an older Git ignores them silently, so AIQE's configuration isolation
      # would be absent while every answer still looked confident.
      #
      # This job is the reason the floor is a measurement rather than a
      # reading of a changelog. The artifact still has to build and install
      # here: refusing to run is not the same as failing to install.
      - name: Prove the artifact still builds and installs on this surface
        if: matrix.proves == 'git-floor-refusal'
        run: |
          python3 bench/run-release-proof.py \
            --parts artifacts,install,scan \
            --output "${RUNNER_TEMP:-/tmp}/surface-artifact.json"
      - name: Prove AIQE refuses on a Git it cannot isolate
        if: matrix.proves == 'git-floor-refusal'
        run: |
          set -u
          git --version
          echo "--- aiqe --version must still answer: it reaches no repository"
          PYTHONPATH=src python3 -m aiqe --version
          failures=0
          for command in "doctor" "task" "check" "receipt" "init --print"; do
            set +e
            PYTHONPATH=src python3 -m aiqe $command > /tmp/out.txt 2> /tmp/err.txt
            rc=$?
            set -e
            if [ "$rc" -ne 3 ]; then
              echo "STOP: 'aiqe $command' exited $rc on git $(git --version), expected 3"
              cat /tmp/err.txt
              failures=$((failures + 1))
            elif ! grep -q GIT_TOO_OLD_FOR_CONFIG_ISOLATION /tmp/err.txt; then
              echo "STOP: 'aiqe $command' refused without naming the reason"
              cat /tmp/err.txt
              failures=$((failures + 1))
            else
              echo "ok: aiqe $command refused with exit 3"
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "The Git floor refusal did not hold on this surface."
            exit 1
          fi
          cat /tmp/err.txt
      # A glob rather than two named paths: not every surface in this matrix
      # writes both records. The Git lower-bound surface deliberately produces
      # no suite record, because on that Git AIQE refuses to run - and
      # `if-no-files-found: error` treats a named path that matches nothing as
      # a failure even when the other one matched.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surface-extra-${{ matrix.label }}
          path: ${{ runner.temp }}/surface-*.json
          if-no-files-found: error

  # --- The macOS surfaces, in the full lane only --------------------------
  #
  #   macos-15           One macOS release below the newest hosted image, so
  #                      the product does not come to depend on the newest
  #                      environment by accident.
  #   macos-15-intel     x86_64 macOS. Without it, Intel Macs are NOT_PROVEN;
  #                      a pure-Python wheel does not prove an architecture.
  #
  # These carry the installed-artifact evidence only, never the suite. The
  # container plumbing and the Git lower-bound steps of `surfaces` are absent
  # rather than switched off: a macOS runner cannot run a Linux container, so
  # here they would be conditions that can never be true.
  surfaces-macos:
    name: surface ${{ matrix.label }}
    needs: lane
    if: needs.lane.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-15-py311
            os: macos-15
            python: "3.11"
          - label: macos-15-intel-py314
            os: macos-15-intel
            python: "3.14"
    runs-on: ${{ matrix.os }}
    env:
      AIQE_RUNNER_LABEL: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Report toolchain
        run: |
          python3 --version
          git --version
      - name: Prove the installed artifact on this surface
        run: |
          python3 bench/run-release-proof.py \
            --parts artifacts,install,e2e,scan \
            --output "${RUNNER_TEMP:-/tmp}/surface-artifact.json"
      # A glob rather than a named path, to stay identical to the record
      # `surfaces` uploads: this job writes the artifact record and no suite
      # record, and `if-no-files-found: error` still catches a job that wrote
      # neither.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surface-extra-${{ matrix.label }}
          path: ${{ runner.temp }}/surface-*.json
          if-no-files-found: error

  # --- Arbitrary-byte paths, which must never be skipped ------------------
  non-utf8-e2e:
    name: linux arbitrary-byte paths (must not skip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Confirm the filesystem accepts a non-UTF-8 filename
        run: |
          python - <<'PY'
          import os, sys, tempfile
          directory = os.fsencode(tempfile.mkdtemp())
          path = os.path.join(directory, b"probe-\xe9\xff.dat")
          try:
              with open(path, "wb") as handle:
                  handle.write(b"x")
          except (OSError, UnicodeError) as exc:
              sys.exit(
                  "STOP: this Linux filesystem refuses a non-UTF-8 filename (%s). "
                  "The arbitrary-byte path proof cannot be produced here and must "
                  "not be downgraded to a parser-only test." % (exc,)
              )
          print("filesystem accepts non-UTF-8 filenames:", os.listdir(directory))
          PY
      - name: Run the end-to-end byte-path cases, refusing to skip
        env:
          AIQE_REQUIRE_NON_UTF8: "1"
        run: |
          python -m unittest tests.test_non_utf8_paths --verbose
          python -m unittest tests.test_task_non_utf8 --verbose
          python -m unittest tests.test_commit_non_utf8 --verbose

  # --- Benchmark families against the retained artifacts ------------------
  benchmark:
    name: benchmark families and controls (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Run the Doctor benchmark family
        run: python bench/run-doctor-fixtures.py --output "${RUNNER_TEMP}/doctor.json"
      - name: Compare the Doctor run against the retained artifact
        run: python bench/compare-results.py "${RUNNER_TEMP}/doctor.json"
      - name: Run the Task benchmark family
        run: python bench/run-task-fixtures.py --output "${RUNNER_TEMP}/task.json"
      - name: Compare the Task run against the retained artifact
        run: python bench/compare-results.py "${RUNNER_TEMP}/task.json"
      - name: Run the check, evidence and receipt benchmark family
        run: python bench/run-check-fixtures.py --output "${RUNNER_TEMP}/check.json"
      - name: Compare the check run against the retained artifact
        run: python bench/compare-results.py "${RUNNER_TEMP}/check.json"
      - name: Run the bounded-commit benchmark family
        run: python bench/run-commit-fixtures.py --output "${RUNNER_TEMP}/commit.json"
      - name: Compare the commit run against the retained artifact
        run: python bench/compare-results.py "${RUNNER_TEMP}/commit.json"

  # --- The same benchmark families on macOS, in the full lane only --------
  #
  # This job uploads no surface record and is therefore not support evidence;
  # it is a regression check that the retained per-family artifacts still
  # reproduce on a second OS. `manifest` still waits for it, so a benchmark
  # that stops reproducing on macOS fails a full lane rather than being
  # reported after it.
  benchmark-macos:
    name: benchmark families and controls (${{ matrix.os }})
    needs: lane
    if: needs.lane.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Run the Doctor benchmark family
        run: python bench/run-doctor-fixtures.py --output "${RUNNER_TEMP}/doctor.json"
      - name: Compare the Doctor run against the retained artifact
        run: python bench/compare-results.py "${RUNNER_TEMP}/doctor.json"
      - name: Run the Task benchmark family
        run: python bench/run-task-fixtures.py --output "${RUNNER_TEMP}/task.json"
      - name: Compare the Task run against the retained artifact
        run: python bench/compare-results.py "${RUNNER_TEMP}/task.json"
      - name: Run the check, evidence and receipt benchmark family
        run: python bench/run-check-fixtures.py --output "${RUNNER_TEMP}/check.json"
      - name: Compare the check run against the retained artifact
        run: python bench/compare-results.py "${RUNNER_TEMP}/check.json"
      - name: Run the bounded-commit benchmark family
        run: python bench/run-commit-fixtures.py --output "${RUNNER_TEMP}/commit.json"
      - name: Compare the commit run against the retained artifact
        run: python bench/compare-results.py "${RUNNER_TEMP}/commit.json"

  # --- The installable artifact, on every claimed surface -----------------
  #
  # `parts` is explicit rather than defaulted, and the record states which
  # parts did not run, so a reduced job can never be read as a full one. The
  # 3.14 rows run everything: the uv path, the offline runtime proof, the
  # reproducibility measurement and the negative controls need to run once per
  # OS family, not once per interpreter.
  release-proof:
    name: release proof (${{ matrix.os }}, python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python: "3.14"
            parts: artifacts,install,e2e,offline,uv,reproducibility,scan,controls
    runs-on: ${{ matrix.os }}
    env:
      AIQE_RUNNER_LABEL: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Report toolchain
        run: |
          python --version
          git --version
      - name: Build, install and exercise the artifact
        run: |
          python bench/run-release-proof.py \
            --parts "${{ matrix.parts || 'artifacts,install,e2e,scan' }}" \
            --output "${RUNNER_TEMP}/surface.json"
      - name: Show the surface record
        if: always()
        run: cat "${RUNNER_TEMP}/surface.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surface-artifact-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/surface.json

  # --- The installed artifact on macOS, in the full lane only -------------
  #
  # This is the evidence `REQUIRED_EVERYWHERE` asks for: without these four
  # rows no claimed Python minor can be PROVEN, because the artifact would be
  # unproven on a claimed OS family. That is why a fast run's manifest reports
  # every minor NOT_PROVEN, and why only the full lane may be released from.
  release-proof-macos:
    name: release proof (${{ matrix.os }}, python ${{ matrix.python }})
    needs: lane
    if: needs.lane.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
            parts: artifacts,install,e2e,offline,uv,reproducibility,scan,controls
    runs-on: ${{ matrix.os }}
    env:
      AIQE_RUNNER_LABEL: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Report toolchain
        run: |
          python --version
          git --version
      - name: Build, install and exercise the artifact
        run: |
          python bench/run-release-proof.py \
            --parts "${{ matrix.parts || 'artifacts,install,e2e,scan' }}" \
            --output "${RUNNER_TEMP}/surface.json"
      - name: Show the surface record
        if: always()
        run: cat "${RUNNER_TEMP}/surface.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surface-artifact-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/surface.json

  # --- Sanitisation ------------------------------------------------------
  public-scan:
    name: public sanitisation scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - name: Test the scanner before trusting it
        run: ./tools/public-scan/self-test.sh
      - name: Run public scan
        run: ./tools/public-scan/public-scan.sh

  links:
    name: markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - name: Check relative links resolve
        run: |
          set -uo pipefail
          rc=0
          while IFS= read -r -d '' file; do
            dir=$(dirname "$file")
            targets=$(grep -oE '\]\([^)#]+\)' "$file" \
              | sed -E 's/^\]\(//; s/\)$//' \
              | grep -vE '^(https?:|mailto:)' || true)
            if [ -z "$targets" ]; then continue; fi
            while IFS= read -r target; do
              if [ -z "$target" ]; then continue; fi
              if [ ! -e "$dir/$target" ]; then
                echo "BROKEN LINK  $file -> $target"
                rc=1
              fi
            done <<< "$targets"
          done < <(find . -name '*.md' -not -path './.git/*' -print0)
          if [ "$rc" -ne 0 ]; then
            echo "Broken relative links found."
            exit 1
          fi
          echo "All relative markdown links resolve."

  # --- The release-proof manifest ----------------------------------------
  #
  # Collects every surface record and applies the gate. `--require-all-claims`
  # turns a NOT_PROVEN claimed minor into a failure here, which is what makes
  # the README's support section something CI can keep honest. It is passed in
  # the FULL lane only: a fast run has no macOS records, so requiring them
  # there would fail every push for the absence of evidence nobody asked it to
  # produce. The manifest still *records* that absence either way - the claim
  # is refused, not narrowed.
  #
  # The manifest is uploaded as an ephemeral artifact of this private
  # repository. Nothing is published.
  manifest:
    name: release-proof manifest
    needs:
      - lane
      - tests
      - tests-macos
      - surfaces
      - surfaces-macos
      - benchmark
      - benchmark-macos
      - release-proof
      - release-proof-macos
      - non-utf8-e2e
      - public-scan
      - links
    # A skipped `needs` entry skips the dependent job by default, and in the
    # fast lane the four macOS jobs are always skipped. This runs whenever
    # nothing upstream actually failed or was cancelled - the behaviour the
    # bare `needs:` list had back when every job in it always ran. It must not
    # be `always()`: a failed suite has to keep the manifest from being built.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/surfaces
          pattern: surface-*
      - name: List the surface records collected
        run: find "${RUNNER_TEMP}/surfaces" -name '*.json' | sort
      - name: Aggregate and gate the support claims
        env:
          FULL_LANE: ${{ needs.lane.outputs.full }}
        run: |
          set -euo pipefail
          args=(
            --surfaces "${RUNNER_TEMP}/surfaces"
            --output "${RUNNER_TEMP}/release-proof.json"
          )
          if [ "$FULL_LANE" = "true" ]; then
            args+=(--require-all-claims)
          else
            echo "fast lane: claims are recorded, not required." \
                 "Every claimed minor will read NOT_PROVEN because no macOS" \
                 "surface record exists in this run."
          fi
          python bench/aggregate-release-proof.py "${args[@]}"
      - name: Scan the manifest itself
        run: ./tools/public-scan/public-scan.sh "${RUNNER_TEMP}/release-proof.json"
      - name: Show the manifest
        if: always()
        run: cat "${RUNNER_TEMP}/release-proof.json"
      # The lane is in the artifact's name because the Actions UI shows the
      # name and not the JSON, and a fast-lane manifest must never be picked
      # up months later as though it were release evidence.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-proof-manifest-${{ needs.lane.outputs.full == 'true' && 'full' || 'fast' }}
          path: ${{ runner.temp }}/release-proof.json
