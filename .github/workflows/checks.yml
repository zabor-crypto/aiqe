name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is the supported target for v1. Linux is exercised here so the
        # suite is genuinely run on it - and it is the only place the
        # arbitrary-byte path case can exist at all - but running green in CI
        # is not a supported release artifact, and this file makes no such
        # claim.
        #
        # 3.11 is the support floor. 3.14 is the current stable interpreter.
        # The endpoints are tested; the versions between them are not claimed.
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Report toolchain
        run: |
          python --version
          git --version
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . --verbose

  non-utf8-e2e:
    name: linux arbitrary-byte paths (must not skip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Confirm the filesystem accepts a non-UTF-8 filename
        run: |
          python - <<'PY'
          import os, sys, tempfile
          directory = os.fsencode(tempfile.mkdtemp())
          path = os.path.join(directory, b"probe-\xe9\xff.dat")
          try:
              with open(path, "wb") as handle:
                  handle.write(b"x")
          except (OSError, UnicodeError) as exc:
              sys.exit(
                  "STOP: this Linux filesystem refuses a non-UTF-8 filename (%s). "
                  "The arbitrary-byte path proof cannot be produced here and must "
                  "not be downgraded to a parser-only test." % (exc,)
              )
          print("filesystem accepts non-UTF-8 filenames:", os.listdir(directory))
          PY
      - name: Run the end-to-end byte-path cases, refusing to skip
        env:
          AIQE_REQUIRE_NON_UTF8: "1"
        run: |
          python -m unittest tests.test_non_utf8_paths --verbose
          python -m unittest tests.test_task_non_utf8 --verbose
          python -m unittest tests.test_commit_non_utf8 --verbose

  benchmark:
    name: benchmark families and controls (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run the Doctor benchmark family
        run: python bench/run-doctor-fixtures.py --output "${RUNNER_TEMP}/doctor.json"
      - name: Compare the Doctor run against the retained artifact
        run: python bench/compare-results.py "${RUNNER_TEMP}/doctor.json"
      - name: Run the Task benchmark family
        run: python bench/run-task-fixtures.py --output "${RUNNER_TEMP}/task.json"
      - name: Compare the Task run against the retained artifact
        run: python bench/compare-results.py "${RUNNER_TEMP}/task.json"
      - name: Run the check, evidence and receipt benchmark family
        run: python bench/run-check-fixtures.py --output "${RUNNER_TEMP}/check.json"
      - name: Compare the check run against the retained artifact
        run: python bench/compare-results.py "${RUNNER_TEMP}/check.json"
      - name: Run the bounded-commit benchmark family
        run: python bench/run-commit-fixtures.py --output "${RUNNER_TEMP}/commit.json"
      - name: Compare the commit run against the retained artifact
        run: python bench/compare-results.py "${RUNNER_TEMP}/commit.json"

  install:
    name: install from a clean environment (${{ matrix.os }}, python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install into an isolated virtual environment
        run: |
          python -m venv "${RUNNER_TEMP}/aiqe-venv"
          "${RUNNER_TEMP}/aiqe-venv/bin/python" -m pip install --quiet --upgrade pip
          "${RUNNER_TEMP}/aiqe-venv/bin/python" -m pip install --quiet .
      - name: Run the installed entry point
        run: |
          "${RUNNER_TEMP}/aiqe-venv/bin/python" --version
          "${RUNNER_TEMP}/aiqe-venv/bin/aiqe" --version
          "${RUNNER_TEMP}/aiqe-venv/bin/aiqe" doctor
          "${RUNNER_TEMP}/aiqe-venv/bin/aiqe" doctor --format json > /dev/null
          "${RUNNER_TEMP}/aiqe-venv/bin/aiqe" task
          "${RUNNER_TEMP}/aiqe-venv/bin/aiqe" task start --own README.md --label "install proof"
          "${RUNNER_TEMP}/aiqe-venv/bin/aiqe" task
          # The pre-commit workflow, through the installed entry point. The
          # exit codes are the assertion: `init --print` writes nothing and
          # succeeds; `check` refuses with 3 because this repository has no
          # aiqe.toml; `receipt` reports INCOMPLETE with 2 because a task
          # without a check is an ordinary state, not a refusal.
          "${RUNNER_TEMP}/aiqe-venv/bin/aiqe" init --print > /dev/null
          test ! -e aiqe.toml
          "${RUNNER_TEMP}/aiqe-venv/bin/aiqe" check && rc=0 || rc=$?
          test "$rc" -eq 3
          "${RUNNER_TEMP}/aiqe-venv/bin/aiqe" receipt && rc=0 || rc=$?
          test "$rc" -eq 2
          "${RUNNER_TEMP}/aiqe-venv/bin/aiqe" receipt --local --format json > /dev/null \
            && rc=0 || rc=$?
          test "$rc" -eq 2
          # `commit` refuses with 3 for the same reason `check` does: this
          # repository has no aiqe.toml, and an absent configuration is a
          # refusal rather than a default. It runs no validator and never
          # pushes; the exit code is the assertion.
          "${RUNNER_TEMP}/aiqe-venv/bin/aiqe" commit -m "install proof" && rc=0 || rc=$?
          test "$rc" -eq 3
          "${RUNNER_TEMP}/aiqe-venv/bin/aiqe" task end
          echo "Installed console script works."
      - name: Confirm no third-party dependency was installed
        run: |
          "${RUNNER_TEMP}/aiqe-venv/bin/python" - <<'PY'
          import subprocess, sys
          frozen = subprocess.run(
              [sys.executable, "-m", "pip", "list", "--format=freeze"],
              stdout=subprocess.PIPE, check=True,
          ).stdout.decode()
          names = {
              line.split("==")[0].lower()
              for line in frozen.splitlines() if line.strip()
          }
          unexpected = names - {"aiqe", "pip", "setuptools", "wheel"}
          if unexpected:
              sys.exit("unexpected dependencies installed: %s" % sorted(unexpected))
          print("no third-party dependency:", sorted(names))
          PY

  public-scan:
    name: public sanitisation scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the scanner before trusting it
        run: ./tools/public-scan/self-test.sh
      - name: Run public scan
        run: ./tools/public-scan/public-scan.sh

  links:
    name: markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links resolve
        run: |
          set -uo pipefail
          rc=0
          while IFS= read -r -d '' file; do
            dir=$(dirname "$file")
            targets=$(grep -oE '\]\([^)#]+\)' "$file" \
              | sed -E 's/^\]\(//; s/\)$//' \
              | grep -vE '^(https?:|mailto:)' || true)
            if [ -z "$targets" ]; then continue; fi
            while IFS= read -r target; do
              if [ -z "$target" ]; then continue; fi
              if [ ! -e "$dir/$target" ]; then
                echo "BROKEN LINK  $file -> $target"
                rc=1
              fi
            done <<< "$targets"
          done < <(find . -name '*.md' -not -path './.git/*' -print0)
          if [ "$rc" -ne 0 ]; then
            echo "Broken relative links found."
            exit 1
          fi
          echo "All relative markdown links resolve."
