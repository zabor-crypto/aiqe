name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every job that is support evidence writes a *surface record* - a JSON
# document naming the machine it ran on, what it executed, and what it
# skipped - and uploads it. The `manifest` job at the end collects them and
# applies the support gate in `bench/release/support.py`.
#
# That indirection is the point. A green checkmark is not a support claim: a
# claim needs a named surface, a named evidence level and a recorded skip
# list, and `--require-all-claims` makes a missing one fail the build rather
# than quietly narrow the manifest.

jobs:
  # --- Full suite, on every claimed Python minor and OS family ------------
  #
  # The literal minimum the release matrix asks for: all of 3.11 to 3.14, on
  # both claimed families. The interior minors are not inferred from the
  # endpoints, which is what the NC-SUPPORT-CLAIM control exists to
  # demonstrate.
  tests:
    name: suite (${{ matrix.os }}, python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # A documented tiering, not a rounding-down. Linux runs the whole
        # behavioural suite on every claimed interpreter minor. macOS runs it
        # on the ends of the range, and carries the installed-artifact
        # end-to-end on all four through the `release-proof` job below.
        #
        # The support gate encodes exactly that split - the artifact evidence
        # is required on every claimed family, the suite on at least one - and
        # the manifest records, per minor, which families actually ran the
        # suite. What the tiering gives up is a defect that appears only on
        # macOS, only on 3.12 or 3.13, and only in a case the end-to-end does
        # not reach.
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    env:
      AIQE_RUNNER_LABEL: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Report toolchain
        run: |
          python --version
          git --version
      - name: Run the test suite and record the surface
        run: |
          python bench/run-suite.py \
            --output "${RUNNER_TEMP}/surface.json" --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: surface-suite-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/surface.json

  # --- Lower-bound and additional surfaces --------------------------------
  #
  # Each entry answers "which real compatibility risk does this cover", and
  # nothing is here to make the matrix look bigger:
  #
  #   ubuntu-22.04       Ubuntu 22.04 LTS is still in standard support, so it
  #                      is a live user population running an older Python and
  #                      an older toolchain than the newest hosted image.
  #   ubuntu-24.04-arm   Linux on arm64. A pure-Python wheel is not an
  #                      argument about a processor, and without this job
  #                      Linux/arm64 is NOT_PROVEN.
  #   python:3.11-bullseye  Debian 11's Git. This is the Git lower-bound
  #                      surface: the frozen core leans on a dozen Git
  #                      behaviours, and the only honest way to publish a
  #                      boundary is to run the whole suite against an old
  #                      Git rather than to reason about release notes.
  #   macos-15           One macOS release below the newest hosted image, so
  #                      the product does not come to depend on the newest
  #                      environment by accident.
  #   macos-15-intel     x86_64 macOS. Without it, Intel Macs are NOT_PROVEN;
  #                      a pure-Python wheel does not prove an architecture.
  surfaces:
    name: surface ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-22.04-py311
            os: ubuntu-22.04
            python: "3.11"
          - label: ubuntu-24.04-arm-py314
            os: ubuntu-24.04-arm
            python: "3.14"
          - label: debian-11-old-git
            os: ubuntu-latest
            container: python:3.11-bullseye
            proves: git-floor-refusal
          - label: macos-15-py311
            os: macos-15
            python: "3.11"
          - label: macos-15-intel-py314
            os: macos-15-intel
            python: "3.14"
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      AIQE_RUNNER_LABEL: ${{ matrix.os }}
      AIQE_CONTAINER_IMAGE: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: matrix.container == ''
        with:
          python-version: ${{ matrix.python }}
      # A container job runs as root against a workspace owned by the runner
      # user, so Git declines to operate on it at all. This is the container's
      # ownership, not AIQE's: the release-proof runner exports the tracked
      # content with `git ls-files`, and that read has to be possible before
      # anything can be measured.
      - name: Let Git read a workspace owned by another user
        if: matrix.container != ''
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Report toolchain
        run: |
          python3 --version
          git --version
      # Linux surfaces are cheap, so they carry the whole suite. The macOS
      # ones carry the artifact evidence only, for the reason the `tests`
      # matrix states: the suite answers the same questions on a second macOS
      # release, at ten times the price.
      - name: Run the test suite and record the surface
        if: matrix.proves != 'git-floor-refusal' && !startsWith(matrix.os, 'macos')
        run: |
          python3 bench/run-suite.py --output "${RUNNER_TEMP:-/tmp}/surface-suite.json"
      - name: Prove the installed artifact on this surface
        if: matrix.proves != 'git-floor-refusal'
        run: |
          python3 bench/run-release-proof.py \
            --parts artifacts,install,e2e,scan \
            --output "${RUNNER_TEMP:-/tmp}/surface-artifact.json"

      # The Git lower-bound surface does not run the suite, because on this
      # Git AIQE refuses to run at all - and that refusal is the thing being
      # proved. GIT_CONFIG_SYSTEM and GIT_CONFIG_GLOBAL arrived in Git 2.32;
      # an older Git ignores them silently, so AIQE's configuration isolation
      # would be absent while every answer still looked confident.
      #
      # This job is the reason the floor is a measurement rather than a
      # reading of a changelog. The artifact still has to build and install
      # here: refusing to run is not the same as failing to install.
      - name: Prove the artifact still builds and installs on this surface
        if: matrix.proves == 'git-floor-refusal'
        run: |
          python3 bench/run-release-proof.py \
            --parts artifacts,install,scan \
            --output "${RUNNER_TEMP:-/tmp}/surface-artifact.json"
      - name: Prove AIQE refuses on a Git it cannot isolate
        if: matrix.proves == 'git-floor-refusal'
        run: |
          set -u
          git --version
          echo "--- aiqe --version must still answer: it reaches no repository"
          PYTHONPATH=src python3 -m aiqe --version
          failures=0
          for command in "doctor" "task" "check" "receipt" "init --print"; do
            set +e
            PYTHONPATH=src python3 -m aiqe $command > /tmp/out.txt 2> /tmp/err.txt
            rc=$?
            set -e
            if [ "$rc" -ne 3 ]; then
              echo "STOP: 'aiqe $command' exited $rc on git $(git --version), expected 3"
              cat /tmp/err.txt
              failures=$((failures + 1))
            elif ! grep -q GIT_TOO_OLD_FOR_CONFIG_ISOLATION /tmp/err.txt; then
              echo "STOP: 'aiqe $command' refused without naming the reason"
              cat /tmp/err.txt
              failures=$((failures + 1))
            else
              echo "ok: aiqe $command refused with exit 3"
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "The Git floor refusal did not hold on this surface."
            exit 1
          fi
          cat /tmp/err.txt
      - uses: actions/upload-artifact@v4
        with:
          name: surface-extra-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/surface-suite.json
            ${{ runner.temp }}/surface-artifact.json
          if-no-files-found: error

  # --- Arbitrary-byte paths, which must never be skipped ------------------
  non-utf8-e2e:
    name: linux arbitrary-byte paths (must not skip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Confirm the filesystem accepts a non-UTF-8 filename
        run: |
          python - <<'PY'
          import os, sys, tempfile
          directory = os.fsencode(tempfile.mkdtemp())
          path = os.path.join(directory, b"probe-\xe9\xff.dat")
          try:
              with open(path, "wb") as handle:
                  handle.write(b"x")
          except (OSError, UnicodeError) as exc:
              sys.exit(
                  "STOP: this Linux filesystem refuses a non-UTF-8 filename (%s). "
                  "The arbitrary-byte path proof cannot be produced here and must "
                  "not be downgraded to a parser-only test." % (exc,)
              )
          print("filesystem accepts non-UTF-8 filenames:", os.listdir(directory))
          PY
      - name: Run the end-to-end byte-path cases, refusing to skip
        env:
          AIQE_REQUIRE_NON_UTF8: "1"
        run: |
          python -m unittest tests.test_non_utf8_paths --verbose
          python -m unittest tests.test_task_non_utf8 --verbose
          python -m unittest tests.test_commit_non_utf8 --verbose

  # --- Benchmark families against the retained artifacts ------------------
  benchmark:
    name: benchmark families and controls (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run the Doctor benchmark family
        run: python bench/run-doctor-fixtures.py --output "${RUNNER_TEMP}/doctor.json"
      - name: Compare the Doctor run against the retained artifact
        run: python bench/compare-results.py "${RUNNER_TEMP}/doctor.json"
      - name: Run the Task benchmark family
        run: python bench/run-task-fixtures.py --output "${RUNNER_TEMP}/task.json"
      - name: Compare the Task run against the retained artifact
        run: python bench/compare-results.py "${RUNNER_TEMP}/task.json"
      - name: Run the check, evidence and receipt benchmark family
        run: python bench/run-check-fixtures.py --output "${RUNNER_TEMP}/check.json"
      - name: Compare the check run against the retained artifact
        run: python bench/compare-results.py "${RUNNER_TEMP}/check.json"
      - name: Run the bounded-commit benchmark family
        run: python bench/run-commit-fixtures.py --output "${RUNNER_TEMP}/commit.json"
      - name: Compare the commit run against the retained artifact
        run: python bench/compare-results.py "${RUNNER_TEMP}/commit.json"

  # --- The installable artifact, on every claimed surface -----------------
  #
  # `parts` is explicit rather than defaulted, and the record states which
  # parts did not run, so a reduced job can never be read as a full one. The
  # 3.14 rows run everything: the uv path, the offline runtime proof, the
  # reproducibility measurement and the negative controls need to run once per
  # OS family, not once per interpreter.
  release-proof:
    name: release proof (${{ matrix.os }}, python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
            parts: artifacts,install,e2e,offline,uv,reproducibility,scan,controls
          - os: ubuntu-latest
            python: "3.14"
            parts: artifacts,install,e2e,offline,uv,reproducibility,scan,controls
    runs-on: ${{ matrix.os }}
    env:
      AIQE_RUNNER_LABEL: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Report toolchain
        run: |
          python --version
          git --version
      - name: Build, install and exercise the artifact
        run: |
          python bench/run-release-proof.py \
            --parts "${{ matrix.parts || 'artifacts,install,e2e,scan' }}" \
            --output "${RUNNER_TEMP}/surface.json"
      - name: Show the surface record
        if: always()
        run: cat "${RUNNER_TEMP}/surface.json"
      - uses: actions/upload-artifact@v4
        with:
          name: surface-artifact-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/surface.json

  # --- Sanitisation ------------------------------------------------------
  public-scan:
    name: public sanitisation scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - name: Test the scanner before trusting it
        run: ./tools/public-scan/self-test.sh
      - name: Run public scan
        run: ./tools/public-scan/public-scan.sh

  links:
    name: markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - name: Check relative links resolve
        run: |
          set -uo pipefail
          rc=0
          while IFS= read -r -d '' file; do
            dir=$(dirname "$file")
            targets=$(grep -oE '\]\([^)#]+\)' "$file" \
              | sed -E 's/^\]\(//; s/\)$//' \
              | grep -vE '^(https?:|mailto:)' || true)
            if [ -z "$targets" ]; then continue; fi
            while IFS= read -r target; do
              if [ -z "$target" ]; then continue; fi
              if [ ! -e "$dir/$target" ]; then
                echo "BROKEN LINK  $file -> $target"
                rc=1
              fi
            done <<< "$targets"
          done < <(find . -name '*.md' -not -path './.git/*' -print0)
          if [ "$rc" -ne 0 ]; then
            echo "Broken relative links found."
            exit 1
          fi
          echo "All relative markdown links resolve."

  # --- The release-proof manifest ----------------------------------------
  #
  # Collects every surface record and applies the gate. `--require-all-claims`
  # turns a NOT_PROVEN claimed minor into a failure here, which is what makes
  # the README's support section something CI can keep honest.
  #
  # The manifest is uploaded as an ephemeral artifact of this private
  # repository. Nothing is published.
  manifest:
    name: release-proof manifest
    needs: [tests, surfaces, release-proof, benchmark, non-utf8-e2e, public-scan, links]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The retained manifest names the commit an
          # artifact was built from, and the test that keeps a foreign
          # object id out of it has to be able to look that commit up.
          # A shallow clone makes every id look foreign.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/surfaces
          pattern: surface-*
      - name: List the surface records collected
        run: find "${RUNNER_TEMP}/surfaces" -name '*.json' | sort
      - name: Aggregate and gate the support claims
        run: |
          python bench/aggregate-release-proof.py \
            --surfaces "${RUNNER_TEMP}/surfaces" \
            --output "${RUNNER_TEMP}/release-proof.json" \
            --require-all-claims
      - name: Scan the manifest itself
        run: ./tools/public-scan/public-scan.sh "${RUNNER_TEMP}/release-proof.json"
      - name: Show the manifest
        if: always()
        run: cat "${RUNNER_TEMP}/release-proof.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-proof-manifest
          path: ${{ runner.temp }}/release-proof.json
